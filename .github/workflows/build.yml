name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Opsional: tanda tangan rilis dengan keystore sendiri (isi lewat Settings > Secrets). Bila kosong,
      # APK ditandatangani kunci debug. Lihat README bagian "Tanda tangan rilis".
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      NEX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      NEX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      NEX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Paket SDK 'tools' sudah dihapus Google, sedangkan bawaan action ini masih memintanya
      # ("Failed to find package 'tools'"). packages: '' = lewati; lisensi SDK tetap diterima.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Pastikan platform Android 16 (API 36) dan build-tools tersedia.
      # Bila gagal, Gradle tetap mencoba mengunduhnya sendiri.
      - name: Siapkan komponen SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Siapkan keystore (opsional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NEX_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK rilis (R8 + shrink resources)
        run: gradle assembleRelease --stacktrace

      - name: Siapkan APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NexFpsOverlay.apk
          echo "Ukuran APK:"
          ls -lh dist/NexFpsOverlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NexFpsOverlay-apk
          path: dist/NexFpsOverlay.apk

      # Membuat Release otomatis saat ada tag versi, mis. v1.0.0
      - name: Terbitkan Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NexFpsOverlay.apk
